# Label definitions for octo-cli-pm-inbox
# Sync with: gh label create --file .github/labels.yml (via gh-label CLI or manual)

# ==== 类型 type/ ====
- name: "type/bug"
  color: "d73a4a"
  description: "缺陷反馈"
- name: "type/feature"
  color: "a2eeef"
  description: "新功能需求"
- name: "type/question"
  color: "d876e3"
  description: "疑问/求助（暂不排期）"
- name: "type/discussion"
  color: "cc317c"
  description: "讨论议题"

# ==== 优先级 priority/ ====
- name: "priority/p0"
  color: "b60205"
  description: "紧急，阻塞使用"
- name: "priority/p1"
  color: "d93f0b"
  description: "高优，本迭代内做"
- name: "priority/p2"
  color: "fbca04"
  description: "中等，下迭代候选"
- name: "priority/p3"
  color: "0e8a16"
  description: "低优，长尾"

# ==== 状态 status/ ====
- name: "status/new"
  color: "ededed"
  description: "刚收，待评估"
- name: "status/triaged"
  color: "c2e0c6"
  description: "已分类"
- name: "status/prd-drafting"
  color: "bfd4f2"
  description: "PRD 撰写中"
- name: "status/prd-review"
  color: "5319e7"
  description: "PRD 待 review"
- name: "status/prd-changes"
  color: "e99695"
  description: "PRD 需修改"
- name: "status/prd-approved"
  color: "0e8a16"
  description: "PRD 通过"
- name: "status/wontfix"
  color: "ffffff"
  description: "不做（考官触发）"
- name: "status/done"
  color: "1d76db"
  description: "完成"

# ==== 特殊标签 ====
- name: "needs-human"
  color: "ff9800"
  description: "转人工：Agent 需要 Nati 介入"
- name: "kb-reference-broken"
  color: "e11d21"
  description: "知识库引用失效（自校验发现）"
- name: "duplicate"
  color: "cfd3d7"
  description: "重复单"
